<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>QueueKit</title>
  <!-- Near-black ChaiUI surface; brand orange is allowed in the logo only. -->
  <rect width="32" height="32" rx="8" fill="#0A0A0A"/>
  <!-- Descending queue bars: waiting → active → drained. -->
  <rect x="6" y="8" width="20" height="4" rx="2" fill="#F5E6D3"/>
  <rect x="6" y="14" width="14" height="4" rx="2" fill="#E8953A"/>
  <rect x="6" y="20" width="8" height="4" rx="2" fill="#F5E6D3" fill-opacity="0.5"/>
</svg>
